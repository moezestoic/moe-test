<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطلب مواد البناء الفاخرة من الصين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17292E; --porcelain:#F5F6F4; --line:#D8DDD9; --brass:#A07D3B; --brass-deep:#7A5C22; --brass-tint:#F3ECDD; --white:#fff; --red:#B42318;
  --display:"Noto Kufi Arabic",system-ui,sans-serif; --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
html[lang="en"]{--display:"IBM Plex Sans",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--porcelain);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{margin:0;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

main{max-width:672px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:20px 16px 0}
@media(min-width:640px){main{padding-top:32px}}
header{margin-bottom:32px}
header h1{font:700 24px/1.5 var(--display);margin:0}
html[lang="en"] header h1{line-height:1.3;letter-spacing:-.01em}
@media(min-width:640px){header h1{font-size:30px}}
header p{margin:8px 0 0;color:rgba(23,41,46,.7);font-size:16px}

/* مبدّل اللغة */
.lang{display:flex;justify-content:flex-end;margin-bottom:20px}
.lang div{display:inline-flex;border:1px solid var(--line);border-radius:99px;background:var(--white);padding:3px}
.lang button{min-height:36px;min-width:84px;border:0;border-radius:99px;background:none;padding:0 14px;font-size:14px;font-weight:500;cursor:pointer;color:rgba(23,41,46,.7)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

form{flex:1;display:flex;flex-direction:column}
.progress{margin-bottom:24px}
.bars{display:flex;gap:6px}
.bars span{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .2s}
.bars span.on{background:var(--brass)}
.progress p{margin:8px 0 0;font-size:14px;color:rgba(23,41,46,.6)}
h2{font:700 20px/1.5 var(--display);margin:0 0 20px;outline:none}
@media(min-width:640px){h2{font-size:24px}}
.body{flex:1;padding-bottom:24px}

.chip{min-height:48px;border:1px solid var(--line);background:var(--white);border-radius:12px;padding:10px 16px;font-size:16px;cursor:pointer;transition:border-color .15s,background .15s;text-align:start}
.chip:hover{border-color:rgba(23,41,46,.4)}
.chip.on{border-color:var(--brass);background:var(--brass-tint);font-weight:500}
.chip.center{text-align:center;padding:16px;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid3{grid-template-columns:repeat(3,1fr)}.grid-b{grid-template-columns:repeat(2,1fr)}}
.grid-b{display:grid;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.stack>*+*{margin-top:24px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend,label.l{display:block;padding:0;margin-bottom:6px;font-size:14px;font-weight:500;color:rgba(23,41,46,.8)}
fieldset legend{margin-bottom:8px}
.inp{width:100%;min-height:48px;border:1px solid var(--line);background:var(--white);border-radius:12px;padding:10px 16px;font-size:16px}
.inp::placeholder{color:rgba(23,41,46,.4)}
.inp:focus{border-color:var(--brass);outline:none}
textarea.inp{resize:vertical}
.err{margin:6px 0 0;font-size:14px;color:var(--red)}
.phone{display:flex;gap:8px;direction:ltr}
.dial{min-height:48px;min-width:72px;display:grid;place-items:center;border:1px solid var(--line);background:var(--porcelain);border-radius:12px;padding:0 12px;color:rgba(23,41,46,.7)}
.trap{position:absolute;inset-inline-start:-9999px;width:0;height:0;overflow:hidden}
.fail{border:1px solid #FECDCA;background:#FEF3F2;color:#912018;border-radius:12px;padding:12px 16px;font-size:14px}
.note{margin:8px 0 0;font-size:14px;color:var(--brass-deep)}

/* المنتجات */
.sel{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.sel:empty{display:none}
.sel li{display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;border-radius:99px;padding:4px;padding-inline:12px 4px;font-size:14px}
.sel button{width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.sel button:hover{background:rgba(255,255,255,.15)}
#q{margin-bottom:12px}
#plist{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--white)}
.prow{width:100%;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:var(--white);padding:12px 16px;text-align:start;font-size:16px;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--porcelain)}
.prow.on{background:var(--brass-tint)}
.prow.cat{padding-block:14px}
.prow.head{background:var(--porcelain);font-weight:500}
.grow{flex:1}
.pn{display:block}
.pc{display:block;font-size:14px;color:rgba(23,41,46,.6)}
.box{width:24px;height:24px;flex:none;display:grid;place-items:center;border:1px solid rgba(23,41,46,.3);border-radius:6px;color:transparent}
.prow.on .box{background:var(--brass);border-color:var(--brass);color:#fff}
.badge{background:var(--brass);color:#fff;border-radius:99px;padding:2px 8px;font-size:14px;font-weight:500}
.fwd{color:rgba(23,41,46,.4)}
html[dir="ltr"] .fwd, html[dir="ltr"] .prow.head svg{transform:scaleX(-1)}
.empty{margin:0;padding:24px 16px;text-align:center;color:rgba(23,41,46,.6)}

/* الأزرار */
.bar{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);background:rgba(245,246,244,.95);backdrop-filter:blur(8px)}
.btn-next{flex:1;min-height:48px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:500;padding:0 24px;cursor:pointer;transition:opacity .15s}
.btn-next:hover{opacity:.9}
.btn-next:disabled{opacity:.6;cursor:default}
.btn-prev{min-height:48px;border:0;background:none;border-radius:12px;padding:0 16px;font-weight:500;color:rgba(23,41,46,.7);cursor:pointer}
.btn-prev:hover{color:var(--ink)}

/* النجاح */
.done{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px}
@media(min-width:640px){.done{padding:32px}}
.done h2{margin:0}
.done p{margin:8px 0 0;color:rgba(23,41,46,.75)}
dl{margin:24px 0 0;border:1px solid var(--line);border-radius:12px}
dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px}
dl div+div{border-top:1px solid var(--line)}
dt{color:rgba(23,41,46,.6)} dd{margin:0}
.btn-out{margin-top:24px;min-height:48px;border:1px solid var(--ink);background:none;border-radius:12px;padding:0 20px;font-weight:500;cursor:pointer}
.btn-out:hover{background:var(--ink);color:#fff}
</style>
</head>

      if (!f.unit) e.unit = 'e_unit';
      if (!f.frequency) e.frequency = 'e_frequency';
      if (!f.timing) e.timing = 'e_timing';
      break;
    case 'contact': {
      if (f.name.trim().length < 2) e.name = 'e_name';
      const d = f.phone.replace(/\D/g,'').replace(/^0+/,'');
      if (d.length < 7 || d.length > 10) e.phone = 'e_phone';
      break;
    }
  }
  return e; // نخزّن مفاتيح الرسائل لا نصوصها، فتتبدل مع اللغة / keys, so messages follow the language
}

/* ---------- قوالب HTML / templates ---------- */
const err = (k) => errors[k] ? `<p class="err" role="alert">${esc(t(errors[k]))}</p>` : '';
const chip = (act, id, label, on, cls = '') =>
  `<button type="button" role="radio" aria-checked="${on}" class="chip ${on ? 'on' : ''} ${cls}" data-act="${act}" data-id="${id}">${esc(label)}</button>`;
const group = (key, list, cur) =>
  `<fieldset><legend>${esc(t(key))}</legend><div class="wrap" role="radiogroup">${list.map((x) => chip(key, x.id, L(x), cur === x.id)).join('')}</div>${err(key)}</fieldset>`;

function rowHTML(p, showCat) {
  const on = f.products.includes(p.id);
  return `<button type="button" role="checkbox" aria-checked="${on}" class="prow ${on ? 'on' : ''}" data-act="toggle" data-id="${p.id}">
    <span class="box">${CHECK}</span>
    <span class="grow"><span class="pn">${esc(L(p))}</span>${showCat ? `<span class="pc">${esc(L(p.cat))}</span>` : ''}</span></button>`;
}
function listHTML() {
  const s = q.trim();
  if (s) {
    // كل كلمة تُطابق على حدة، مع تجاهل ة/ات في آخرها (مشربية ← مشربيات) / each word is matched separately
    const words = norm(s).split(/\s+/).filter(Boolean).map((w) => (w.length > 3 ? w.replace(/(ات|ه)$/, '') : w));
    const r = ALL.filter((p) => words.every((w) => p.key.includes(w)));
    return r.length ? r.map((p) => rowHTML(p, true)).join('') : `<p class="empty">${esc(t('empty'))}</p>`;
  }
  const cat = C.categories.find((c) => c.id === openCat);
  if (cat) return `<button type="button" class="prow head" data-act="back">${BACK}${esc(L(cat))}</button>` + cat.products.map((p) => rowHTML(p)).join('');
  return C.categories.map((c) => {
    const n = c.products.filter((p) => f.products.includes(p.id)).length;
    return `<button type="button" class="prow cat" data-act="cat" data-id="${c.id}"><span class="grow">${esc(L(c))}</span>${n ? `<span class="badge">${nf(n)}</span>` : ''}${FWD}</button>`;
  }).join('');
}
const noticeText = () => (notice ? t(notice.k, nf(notice.n)) : '');
function chipsHTML() {
  return f.products.map((id) =>
    `<li>${esc(L(BYID[id]))}<button type="button" data-act="remove" data-id="${id}" aria-label="${esc(t('remove', L(BYID[id])))}">${X}</button></li>`).join('');
}
function refreshProducts(focusId) {
  $('#chips').innerHTML = chipsHTML();
  $('#plist').innerHTML = listHTML();
  $('#perr').innerHTML = err('products');
  $('#notice').textContent = noticeText();
  if (focusId) { const b = document.querySelector(`#plist [data-id="${focusId}"]`); if (b) b.focus({ preventScroll: true }); }
}

function stepHTML() {
  switch (STEPS[step]) {
    case 'market':
      return `<div class="grid2 grid3" role="radiogroup" aria-label="${esc(t('marketAria'))}">${C.markets.map((m) => chip('market', m.id, L(m), f.market === m.id, 'center')).join('')}</div>${err('market')}`;
    case 'buyer':
      return `<div class="grid-b" role="radiogroup" aria-label="${esc(t('buyerAria'))}">${C.buyers.map((b) => chip('buyer', b.id, L(b), f.buyer === b.id)).join('')}</div>${err('buyer')}`;
    case 'products':
      return `<ul class="sel" id="chips" aria-label="${esc(t('selAria'))}">${chipsHTML()}</ul>
        <input class="inp" id="q" type="search" value="${esc(q)}" placeholder="${esc(t('searchPh'))}" aria-label="${esc(t('searchAria'))}">
        <div id="plist">${listHTML()}</div><div id="perr">${err('products')}</div><p class="note" id="notice" role="status">${esc(noticeText())}</p>`;
    case 'quantity':
      return `<div class="stack">
        <div class="field"><label class="l" for="qty">${esc(t('qty'))}</label>
          <input class="inp" id="qty" data-field="quantity" type="number" inputmode="decimal" min="0" value="${esc(f.quantity)}" placeholder="${esc(t('qtyPh'))}">${err('quantity')}</div>
        ${group('unit', C.units, f.unit)}
        ${group('frequency', C.frequency, f.frequency)}
        ${group('timing', C.timing, f.timing)}
        <div class="field"><label class="l" for="note">${esc(t('note'))}</label>
          <textarea class="inp" id="note" data-field="note" rows="3" maxlength="1000" placeholder="${esc(t('notePh'))}">${esc(f.note)}</textarea></div></div>`;
    case 'contact': {
      const m = C.markets.find((x) => x.id === f.market);
      return `<div class="stack">
        <div class="field"><label class="l" for="name">${esc(t('name'))}</label>
          <input class="inp" id="name" data-field="name" autocomplete="name" value="${esc(f.name)}">${err('name')}</div>
        <div class="field"><label class="l" for="company">${esc(t('company'))}</label>
          <input class="inp" id="company" data-field="company" autocomplete="organization" value="${esc(f.company)}"></div>
        <div class="field"><label class="l" for="phone">${esc(t('phone'))}</label>
          <div class="phone"><span class="dial">+${m ? m.dial : ''}</span>
          <input class="inp" id="phone" data-field="phone" type="tel" inputmode="tel" autocomplete="tel-national" value="${esc(f.phone)}" placeholder="${esc(t('phonePh'))}"></div>${err('phone')}</div>
        <div class="trap" aria-hidden="true"><label>${esc(t('trap'))}<input tabindex="-1" autocomplete="off" data-field="website" value="${esc(f.website)}"></label></div>
        ${status === 'error' ? `<p class="fail" role="alert">${esc(t('fail'))}</p>` : ''}</div>`;
    }
  }
}

function renderHead() {
  $('#head').innerHTML = `<div class="lang"><div role="group" aria-label="${esc(t('langAria'))}">
      <button type="button" lang="ar" data-act="lang" data-id="ar" aria-pressed="${lang === 'ar'}">العربية</button>
      <button type="button" lang="en" data-act="lang" data-id="en" aria-pressed="${lang === 'en'}">English</button></div></div>
    <h1>${esc(t('h1'))}</h1><p>${esc(t('sub'))}</p>`;
}

function render() {
  const root = $('#root');
  if (status === 'done') {
    root.innerHTML = `<section class="done"><h2 id="title" tabindex="-1">${esc(t('doneTitle'))}</h2>
      <p>${esc(t('doneMsg', '\u0000')).replace('\u0000', `<bdi dir="ltr"><strong>+${esc(sentPhone)}</strong></bdi>`)}</p>
      ${SUPABASE_URL ? '' : `<p class="note">${esc(t('demo'))}</p>`}
      <dl>
        <div><dt>${esc(t('dCountry'))}</dt><dd>${esc(nameOf(C.markets, f.market))}</dd></div>
        <div><dt>${esc(t('dBuyer'))}</dt><dd>${esc(nameOf(C.buyers, f.buyer))}</dd></div>
        <div><dt>${esc(t('dProducts'))}</dt><dd style="text-align:end">${f.products.map((id) => esc(L(BYID[id]))).join(esc(t('sep')))}</dd></div>
        <div><dt>${esc(t('dQty'))}</dt><dd>${nf(f.quantity)} ${esc(nameOf(C.units, f.unit))}</dd></div>
      </dl>
      <button type="button" class="btn-out" data-act="reset">${esc(t('again'))}</button></section>`;
    return;
  }
  const single = ['market', 'buyer'].includes(STEPS[step]);
  const last = step === STEPS.length - 1, sending = status === 'sending';
  root.innerHTML = `<form id="frm" novalidate>
    <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${STEPS.length}" aria-valuenow="${step + 1}" aria-label="${esc(t('progress'))}">
      <div class="bars">${STEPS.map((s, i) => `<span class="${i <= step ? 'on' : ''}"></span>`).join('')}</div>
      <p>${esc(t('stepOf', nf(step + 1), nf(STEPS.length)))}</p></div>
    <h2 id="title" tabindex="-1">${esc(t('s_' + STEPS[step]))}</h2>
    <div class="body">${stepHTML()}</div>
    <div class="bar">
      ${step > 0 ? `<button type="button" class="btn-prev" data-act="prev" ${sending ? 'disabled' : ''}>${esc(t('prev'))}</button>` : ''}
      ${single ? '' : `<button type="submit" class="btn-next" ${sending ? 'disabled' : ''}>${esc(sending ? t('sending') : last ? t('send') : t('next'))}</button>`}
    </div></form>`;
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch (e) {}
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.title = t('title');
  renderHead(); render();
  const b = document.querySelector(`[data-act="lang"][data-id="${l}"]`); if (b) b.focus({ preventScroll: true });
}

function focusTitle() { const el = $('#title'); if (el) el.focus({ preventScroll: true }); window.scrollTo({ top: 0 }); }
function go(n) { step = n; errors = {}; notice = null; render(); focusTitle(); }
function next() {
  errors = validate();
  if (Object.keys(errors).length) { render(); return; }
  if (step < STEPS.length - 1) go(step + 1); else send();
}
function toggleProduct(id) {
  if (f.products.includes(id)) { f.products = f.products.filter((x) => x !== id); notice = null; }
  else if (f.products.length >= MAX) { notice = { k: 'max', n: MAX }; }
  else { f.products.push(id); notice = null; errors = {}; if (!f.unit) f.unit = BYID[f.products[0]].unit; }
  refreshProducts(id);
}

/* ---------- الإرسال إلى Supabase / submit ---------- */
function readUtm() {
  const p = new URLSearchParams(location.search), u = { lang };
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid'].forEach((k) => { if (p.get(k)) u[k] = p.get(k); });
  return u;
}
async function post(table, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(await r.text());
}
async function send() {
  if (f.website) { status = 'done'; sentPhone = '—'; render(); focusTitle(); return; } // bot: ignore silently
  status = 'sending'; render();
  try {
    const dial = C.markets.find((m) => m.id === f.market).dial;
    const phone = dial + f.phone.replace(/\D/g,'').replace(/^0+/,'');
    const id = crypto.randomUUID();
    const request = {
      id, market_id: f.market, buyer_segment_id: f.buyer, quantity: Number(f.quantity), unit: f.unit,
      frequency: f.frequency, timing: f.timing, note: f.note.trim() || null,
      full_name: f.name.trim(), company: f.company.trim() || null, whatsapp: phone, utm: readUtm(),
    };
    const items = f.products.map((product_id) => ({ request_id: id, product_id }));
    if (!SUPABASE_URL) { console.warn('Supabase not configured: demo mode', { request, items }); await new Promise((r) => setTimeout(r, 600)); }
    else { await post('demand_requests', request); await post('demand_request_items', items); }
    sentPhone = phone; status = 'done'; render(); focusTitle();
  } catch (e) {
    console.error(e); status = 'error'; render();
  }
}

/* ---------- الأحداث / events ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'lang') setLang(id);
  else if (a === 'market' || a === 'buyer') { f[a] = id; errors = {}; render(); setTimeout(() => go(step + 1), 160); }
  else if (a === 'unit' || a === 'frequency' || a === 'timing') {
    f[a] = id; delete errors[a]; render();
    const el = document.querySelector(`[data-act="${a}"][data-id="${id}"]`); if (el) el.focus({ preventScroll: true });
  }
  else if (a === 'cat') { openCat = id; refreshProducts(); }
  else if (a === 'back') { openCat = null; refreshProducts(); }
  else if (a === 'toggle' || a === 'remove') toggleProduct(id);
  else if (a === 'prev') go(step - 1);
  else if (a === 'reset') { f = EMPTY(); q = ''; openCat = null; status = 'idle'; go(0); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'q') { q = el.value; refreshProducts(); return; }
  const k = el.dataset.field; if (!k) return;
  f[k] = el.value;
  if (errors[k]) { delete errors[k]; const w = el.closest('.field'); if (w) { const p = w.querySelector('.err'); if (p) p.remove(); } }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (!['market', 'buyer'].includes(STEPS[step])) next();
});

/* بدء التشغيل / start */
document.documentElement.lang = lang;
document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
document.title = t('title');
renderHead(); render();
</script>
</body>
</html>
